name: Build_msm8916

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean

env:
  ALL_DEVICES: "ufi103s"
  REPO_URL: https://github.com/xuxin1955/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
       contents: write
       
    strategy:
      fail-fast: false
      matrix:
        device:
          - ufi103s
    steps:
   
    - name: Checkout
      uses: actions/checkout@main
      
    - name: 记录当前编译型号
      run: |
        echo "CONFIG_FILE=config/${{ matrix.device }}.config" >> $GITHUB_ENV

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update && sudo -E apt-get -y install --no-install-recommends $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: Cache mkbootimg deb
      uses: actions/cache@v5
      with:
        path: downloads/mkbootimg_34.0.5-12build1_all.deb
        key: mkbootimg-34.0.5-12build1
        restore-keys: |
          mkbootimg-

    - name: mkbootimg build
      run: |
        mkdir -p downloads
        cd downloads

        if [ ! -f mkbootimg_34.0.5-12build1_all.deb ]; then
          echo "📥 mkbootimg deb not cached, downloading..."
          wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        else
          echo "✅ mkbootimg deb restored from cache"
        fi

        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || true
        sudo apt-get install -f -y

        mkbootimg --help || true

        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 🔧 自动修复SIM卡引脚配置 (Fix SIM GPIO DTS)
      run: |
        cd /mnt/openwrt
        DTS=target/linux/msm89xx/dts/msm8916-thwc-ufi001c.dts
        cat > $DTS << 'DTSEOF'
// SPDX-License-Identifier: GPL-2.0-only

/dts-v1/;

#include "msm8916-ufi.dtsi"

/ {
	model = "ufi-001c 4G Modem Stick";
	compatible = "thwc,ufi001c", "qcom,msm8916";
	leds: leds {
	};
};

&button_restart {
	gpios = <&tlmm 37 GPIO_ACTIVE_HIGH>;
};

&led_r {
	gpios = <&tlmm 22 GPIO_ACTIVE_HIGH>;
};

&led_g {
	gpios = <&tlmm 21 GPIO_ACTIVE_HIGH>;
};

&led_b {
	gpios = <&tlmm 20 GPIO_ACTIVE_HIGH>;
};

&mpss {
	pinctrl-0 = <&sim_ctrl_default>;
	pinctrl-names = "default";
};

&button_default {
	pins = "gpio37";
	bias-pull-down;
};

&gpio_leds_default {
	pins = "gpio20", "gpio21", "gpio22";
};

/* This selects the external SIM card slot by default */
&tlmm {
	sim_ctrl_default: sim-ctrl-default-state {
		esim-sel-pins {
			pins = "gpio0", "gpio3";
			bias-disable;
			output-low;
		};

		sim-en-pins {
			pins = "gpio1";
			bias-disable;
			output-low;
		};

		sim-sel-pins {
			pins = "gpio2";
			bias-disable;
			output-high;
		};
	};
};
DTSEOF
        echo "✅ DTS 修复完成，当前配置："
        cat $DTS

    - name: Load custom DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a -f

    - name: remove warning
      run: |
        chmod 755 $GITHUB_WORKSPACE/scripts/diy-part.sh
        $GITHUB_WORKSPACE/scripts/diy-part.sh

    - name: Load custom DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: make defconfig
      run: |
        cd openwrt
        make defconfig V=s

    - name: Setup ccache
      run: |
        mkdir -p /mnt/openwrt/.ccache
        echo "CCACHE_DIR=/mnt/openwrt/.ccache" >> "$GITHUB_ENV"
        ccache --set-config=cache_dir=/mnt/openwrt/.ccache
        ccache --set-config=max_size=10G
        ccache --set-config=compression=true

    - name: Download package
      run: |
        cd openwrt
        make download -j$(nproc) -k V=s 2>&1 | tail -5

    - name: make -j$(nproc)
      id: compile
      run: |
        cd openwrt
        set +e
        make -j$(nproc)
        BUILD_EXIT=$?
        set -e
        if [ $BUILD_EXIT -ne 0 ]; then
          make -j8 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
      shell: bash

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=MSM8916-$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=MSM8916-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        touch release.txt
        {
        echo "## 高通8916系列 immortalwrt"
        echo "- 编译时间: $(date +"%Y%m%d %H:%M:%S")"
        echo "- 编译机型: ufi103s"
        echo "- 管理地址: 192.168.10.1"
        echo "- 默认用户: root"
        echo "- 默认密码: 空"
        } >> release.txt

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: openwrt/bin/targets/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false
